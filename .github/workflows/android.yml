name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Unit tests (rules, fuzzing, screenshots)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/screens/*.png

      - name: Publish screenshot preview (pre-release "ci-screenshots")
        if: always() && github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls app/build/screens/*.png >/dev/null 2>&1; then
            (cd app/build/screens && zip -q -r ../../../screenshots.zip .)
            if ! gh release view ci-screenshots >/dev/null 2>&1; then
              gh release create ci-screenshots --prerelease --title "CI screenshots (automated preview)" \
                --notes "Rendered by the test suite on every push. Not an app release." --target "$GITHUB_SHA"
            fi
            gh release upload ci-screenshots screenshots.zip --clobber
          fi

      - name: Upload test report
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: open-arcade-debug-apk
          path: app/build/outputs/apk/debug/*.apk
