name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Decode signing keystore (if configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release keystore from secrets."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - signing with a debug key."
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/OpenArcade-$TAG.apk"
          (cd dist && sha256sum "OpenArcade-$TAG.apk" > "OpenArcade-$TAG.apk.sha256")
          ls -la dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          ## Open Arcade $TAG

          An offline retro game console for Android (5.0+) with 16 games:
          Minesweeper, 2048, Sudoku, Meowdoku, Nonogram, Flow Link, Unblock, Lights Out,
          Tetromino, Snake, Maze Muncher, Brick Breaker, Paddle Ball, Alien Invasion, Chess and Checkers.

          No ads, no accounts, no internet permission.

          **Install:** download \`OpenArcade-$TAG.apk\` on your phone and open it
          (allow "install unknown apps" for your browser or file manager when prompted).
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Open Arcade $TAG" --notes-file notes.md --target "$GITHUB_SHA"
          fi
