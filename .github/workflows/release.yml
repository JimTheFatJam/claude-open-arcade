name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Check tag matches versionName
        run: |
          VN=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [ "v$VN" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName $VN in app/build.gradle.kts"
            exit 1
          fi

      - name: Decode signing keystore (if configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release keystore from secrets."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - signing with a debug key."
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/OpenArcade-$TAG.apk"
          (cd dist && sha256sum "OpenArcade-$TAG.apk" > "OpenArcade-$TAG.apk.sha256")
          ls -la dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes = this version's CHANGELOG.md section (shown by the in-app updater),
          # then install instructions after a '---' line (the updater ignores everything after it).
          VER="${TAG#v}"
          awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "- Open Arcade $TAG" > notes.md; fi
          {
            echo ""
            echo "---"
            echo "**Install:** download \`OpenArcade-$TAG.apk\` on your Android phone or tablet (5.0+) and open it."
            echo "Installed copies update themselves: the game checks for new releases on Wi-Fi."
          } >> notes.md
          cat notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --title "Open Arcade $TAG" --notes-file notes.md --target "$GITHUB_SHA"
          fi
